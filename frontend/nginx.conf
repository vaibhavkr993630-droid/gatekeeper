# Processed by the nginx image's envsubst at startup: ${BACKEND_UPSTREAM} is
# replaced with host:port (docker-compose: backend:8000; Railway: the private
# service address). Only BACKEND_* vars are substituted (NGINX_ENVSUBST_FILTER),
# so nginx's own $host / $http_upgrade / etc. are left untouched.
server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Dashboard REST API + gateway data-plane + live-feed WebSocket, all
    # reverse-proxied to the backend so the browser only ever talks to one
    # origin (no CORS needed in this deployment).
    location /api/ {
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /gw/ {
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://${BACKEND_UPSTREAM};
    }

    # client-side routing (React Router) — anything else falls back to index.html
    location / {
        try_files $uri /index.html;
    }
}
