server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Dashboard REST API + gateway data-plane + live-feed WebSocket, all
    # reverse-proxied to the backend container so the browser only ever
    # talks to one origin (no CORS needed in this deployment).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /gw/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:8000;
    }

    # client-side routing (React Router) — anything else falls back to index.html
    location / {
        try_files $uri /index.html;
    }
}
